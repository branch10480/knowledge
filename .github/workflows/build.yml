name: Validate and deploy Knowledge

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"  # 09:00 JST (= 00:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-pages
  cancel-in-progress: false

jobs:
  validate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Install pinned gitleaks
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          bin_dir="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$bin_dir"
          curl -fsSLo "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$bin_dir" gitleaks
          chmod 0555 "$bin_dir/gitleaks"
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"

      - name: Validate source data
        run: python -m knowledge.cli validate-data --entries data/entries.json
        env:
          PYTHONPATH: src

      - name: Run tests
        run: python -m pytest

      - name: Build in a clean directory
        run: python -m knowledge.cli build --entries data/entries.json --output "$RUNNER_TEMP/knowledge-dist"
        env:
          PYTHONPATH: src

      - name: Validate generated site
        run: |
          python -m knowledge.cli check-build --entries data/entries.json --dist "$RUNNER_TEMP/knowledge-dist"
          python -m knowledge.cli validate-atom "$RUNNER_TEMP/knowledge-dist/feed.xml"
        env:
          PYTHONPATH: src

      - name: Scan source and generated output for secrets
        run: ./scripts/scan-secrets.sh --paths data "$RUNNER_TEMP/knowledge-dist"

      - name: Upload verified site
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-dist-${{ github.sha }}
          path: ${{ runner.temp }}/knowledge-dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: validate-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    environment:
      name: github-pages
      url: https://branch10480.github.io/knowledge/
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Download verified site
        uses: actions/download-artifact@v4
        with:
          name: knowledge-dist-${{ github.sha }}
          path: dist

      - name: Checkout deployment branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 1

      - name: Replace deployment tree
        shell: bash
        run: |
          set -Eeuo pipefail
          find pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a dist/. pages/
          touch pages/.nojekyll

      - name: Verify deployment manifest
        run: |
          export PYTHONPATH=src
          python -m knowledge.cli check-build --entries data/entries.json --dist pages

      - name: Commit and push complete snapshot
        working-directory: pages
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "deploy: ${GITHUB_SHA}"
          git push origin HEAD:gh-pages
