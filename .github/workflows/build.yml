name: Build Knowledge Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * *'  # 毎日 9:00 JST (= 0:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate pages
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 build.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html feed.xml entry/ archive/
          git diff --cached --quiet || git commit -m "build: regenerate pages from entries.json"
          git push
