[project]
name = "knowledge"
version = "2.0.0"
description = "Personal tech knowledge-base pipeline: collect, summarize, validate, build, publish."
requires-python = ">=3.9"
dependencies = [
  "jinja2>=3.1",
  "jsonschema>=4.0",
  "pyyaml>=6.0",
]

[project.scripts]
knowledge = "knowledge.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
