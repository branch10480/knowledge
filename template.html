<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge — Toshi Design System</title>
<link rel="alternate" type="application/atom+xml" title="Knowledge Atom Feed" href="feed.xml">
<style>
/* ============================================================
   Fonts — UDEV Gothic 35LG (GitHub Pages absolute URL for external repos)
   ============================================================ */
@font-face {
  font-family: "UDEV Gothic 35LG";
  src: url("https://branch10480.github.io/design-system/fonts/UDEVGothic35LG-Regular.woff2") format("woff2");
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face {
  font-family: "UDEV Gothic 35LG";
  src: url("https://branch10480.github.io/design-system/fonts/UDEVGothic35LG-Bold.woff2") format("woff2");
  font-weight: 700; font-style: normal; font-display: swap;
}
@font-face {
  font-family: "UDEV Gothic 35LG";
  src: url("https://branch10480.github.io/design-system/fonts/UDEVGothic35LG-Italic.woff2") format("woff2");
  font-weight: 400; font-style: italic; font-display: swap;
}

/* ============================================================
   :root tokens — Toshi Design System v0.7.0 (single-page.html と同一)
   ============================================================ */
:root {
  color-scheme: light dark;

  /* surfaces */
  --bg:        #FFFFFF;
  --bg-alt:    #F5F5F7;
  --bg-elev:   #FFFFFF;
  --bg-code:   #F7F7F7;
  --separator: #D2D2D7;
  --hairline:  rgba(0, 0, 0, 0.10);

  /* text */
  --text:   #1D1D1F;
  --text-2: #66666B;
  --text-3: #747479;

  /* tint */
  --tint:            #0066CC;
  --tint-fill:       #0071E3;
  --tint-fill-hover: #0077ED;
  --on-tint:         #FFFFFF;

  /* status */
  --green:  #008009;
  --orange: #B25000;
  --red:    #D70000;
  --purple: #6846C7;

  /* syntax */
  --syn-k: #AD3DA4;
  --syn-t: #703DAA;
  --syn-s: #D12F1B;
  --syn-n: #272AD8;
  --syn-c: #707F8C;
  --syn-f: #4B21B0;
  --syn-d: #03638C;

  /* type */
  --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
               "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue",
               "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Arial, sans-serif;
  --font-mono: "UDEV Gothic 35LG", "UDEV Gothic 35NFLG",
               ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
  --code-weight: 400;

  /* radius */
  --r-pill: 980px;
  --r-xl:   18px;
  --r-lg:   14px;
  --r-md:   10px;
  --r-sm:   6px;

  /* elevation */
  --sh-1:    0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.06);
  --sh-2:    0 11px 34px rgba(0,0,0,.14);
  --sh-menu: 0 10px 40px rgba(0,0,0,.18);

  /* layout */
  --doc-max: 1040px;
  --otp-w: 210px;
  --otp-reserve: calc(var(--otp-w) + 48px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #181818;
    --bg-alt:    #1B1E24;
    --bg-elev:   #252932;
    --bg-code:   #1A1D23;
    --separator: #333842;
    --hairline:  rgba(255, 255, 255, 0.14);
    --text:   #D0D3D8;
    --text-2: #9EA3AA;
    --text-3: #8B9098;
    --tint:   #4A94DC;
    --green:  #86D7A3;
    --orange: #E2BE5A;
    --red:    #E88980;
    --purple: #C2A3E5;
    --code-weight: 400;
    --syn-k: #E06A9F; --syn-t: #C7A8E8; --syn-s: #E77668; --syn-n: #C8BA74;
    --syn-c: #7C8791; --syn-f: #A174D4; --syn-d: #5FC6E6;
    --sh-1:    0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.5);
    --sh-2:    0 11px 34px rgba(0,0,0,.6);
    --sh-menu: 0 10px 40px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"] {
  --bg:        #181818;
  --bg-alt:    #1B1E24;
  --bg-elev:   #252932;
  --bg-code:   #1A1D23;
  --separator: #333842;
  --hairline:  rgba(255, 255, 255, 0.14);
  --text:   #D0D3D8;
  --text-2: #9EA3AA;
  --text-3: #8B9098;
  --tint:   #4A94DC;
  --green:  #86D7A3;
  --orange: #E2BE5A;
  --red:    #E88980;
  --purple: #C2A3E5;
  --code-weight: 400;
  --syn-k: #E06A9F; --syn-t: #C7A8E8; --syn-s: #E77668; --syn-n: #C8BA74;
  --syn-c: #7C8791; --syn-f: #A174D4; --syn-d: #5FC6E6;
  --sh-1:    0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.5);
  --sh-2:    0 11px 34px rgba(0,0,0,.6);
  --sh-menu: 0 10px 40px rgba(0,0,0,.7);
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"]  { color-scheme: dark; }

/* ============================================================
   Base
   ============================================================ */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-text);
  font-size: 17px;
  line-height: 1.47;
  letter-spacing: -0.022em;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--tint); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { font-family: var(--font-display); color: var(--text); }
code, pre { font-family: var(--font-mono); letter-spacing: 0; }

/* ============================================================
   Global nav — frosted blur material (design-system style)
   ============================================================ */
.globalnav {
  position: sticky; top: 0; z-index: 50;
  background: color-mix(in srgb, var(--bg) 72%, transparent);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--hairline);
}
.gn-inner {
  max-width: var(--doc-max); margin: 0 auto; height: 48px;
  padding: 0 22px;
  display: flex; align-items: center; gap: 28px;
}
.gn-brand {
  font-size: 17px; font-weight: 600; color: var(--text); letter-spacing: -0.02em;
}
.gn-brand:hover { text-decoration: none; }
.gn-links { display: flex; gap: 22px; flex: 1; }
.gn-links a {
  font-size: 13px; color: var(--text-2); letter-spacing: -0.01em;
  transition: color 120ms;
}
.gn-links a:hover { color: var(--text); text-decoration: none; }

/* Theme toggle — design-system と同一 */
.theme-toggle {
  font: 500 12px var(--font-text);
  color: var(--text-2);
  background: var(--bg-alt);
  border: 1px solid transparent;
  border-radius: var(--r-pill);
  padding: 5px 14px;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  transition: color 120ms, border-color 120ms;
}
.theme-toggle:hover { color: var(--text); border-color: var(--separator); }
.theme-toggle .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tint); }

/* ============================================================
   Hero — design-system と同一値
   ============================================================ */
.hero {
  background: var(--bg-alt);
  padding: 88px 22px 72px;
  text-align: center;
}
.eyebrow { font-size: 14px; color: var(--text-2); margin: 0 0 10px; font-weight: 500; }
.hero h1 {
  margin: 0 auto;
  font-size: clamp(34px, 5.2vw, 52px);
  font-weight: 600;
  letter-spacing: -0.015em;
  line-height: 1.14;
}
.hero .abstract {
  margin: 20px auto 0;
  max-width: 600px;
  font-size: 21px; line-height: 1.45;
  color: var(--text-2);
  font-weight: 400;
}

/* ============================================================
   Search + Archive + Filter bar
   ============================================================ */
.toolbar {
  max-width: var(--doc-max); margin: 0 auto; padding: 20px 22px 8px;
}
.search-row { display: flex; gap: 10px; align-items: center; }
#search-input {
  flex: 1; font: 400 15px var(--font-text);
  background: var(--bg-elev); border: 1px solid var(--hairline);
  border-radius: var(--r-md); padding: 8px 14px; color: var(--text);
  outline: none; transition: border-color 120ms, box-shadow 120ms;
}
#search-input:focus {
  border-color: var(--tint);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--tint) 18%, transparent);
}
#search-input::placeholder { color: var(--text-3); }
#result-count { font-size: 13px; color: var(--text-3); white-space: nowrap; min-width: 80px; text-align: right; }

.archive-row { margin-top: 14px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.archive-label { font-size: 12px; color: var(--text-3); margin-right: 4px; }
.archive-link {
  font-size: 12px; color: var(--text-2); padding: 3px 10px;
  border-radius: var(--r-pill); background: var(--bg-alt);
  transition: color 120ms, background 120ms;
}
.archive-link:hover { color: var(--text); text-decoration: none; }

.filter-row { margin-top: 14px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.filter-label { font-size: 12px; color: var(--text-3); margin-right: 4px; }
.filter-btn {
  font: 500 12px var(--font-text);
  color: var(--text-2); padding: 4px 12px; border-radius: var(--r-pill);
  background: var(--bg-alt); border: 1px solid transparent;
  cursor: pointer; transition: all 120ms; user-select: none;
}
.filter-btn:hover { color: var(--text); border-color: var(--separator); }
.filter-btn[aria-pressed="true"] {
  background: color-mix(in srgb, var(--tint) 14%, transparent);
  color: var(--tint); font-weight: 600; border-color: transparent;
}

/* ============================================================
   Entry cards — topic-card style (design-system と同一)
   ============================================================ */
.entries-list {
  max-width: var(--doc-max); margin: 0 auto; padding: 12px 22px 96px;
}
.entry-card {
  display: flex; flex-direction: column;
  background: var(--bg-elev);
  border: 1px solid var(--hairline);
  border-radius: var(--r-lg);
  padding: 20px 22px;
  margin-bottom: 16px;
  box-shadow: var(--sh-1);
  transition: transform 180ms ease, box-shadow 180ms ease;
}
.entry-card:hover { transform: translateY(-2px); box-shadow: var(--sh-2); }

.entry-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; }
.entry-title {
  font-size: 18px; font-weight: 600; letter-spacing: -0.01em; margin: 0;
}
.entry-title a { color: var(--text); }
.entry-title a:hover { color: var(--tint); text-decoration: none; }

.entry-meta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--text-3); margin-bottom: 8px; }
.entry-source a { color: var(--tint); }
.entry-source a:hover { text-decoration: underline; }

.entry-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.tag-pill {
  font: 500 11px var(--font-text);
  color: var(--tint); padding: 2px 8px; border-radius: var(--r-pill);
  background: color-mix(in srgb, var(--tint) 12%, transparent);
}

.entry-body { font-size: 15px; line-height: 1.6; color: var(--text); }
.entry-body p { margin: 0 0 8px; }
.entry-body p:last-child { margin-bottom: 0; }
.entry-body code { font-size: 0.92em; background: var(--bg-alt); border-radius: 4px; padding: 1px 5px; color: var(--text); }
.entry-body pre { background: var(--bg-code); border: 1px solid var(--hairline); border-radius: var(--r-lg); padding: 18px 16px; overflow-x: auto; font-size: 15px; line-height: 1.62; }
.entry-body ul, .entry-body ol { margin: 0 0 8px; padding-left: 20px; }
.entry-body li { margin: 3px 0; }

/* ============================================================
   Footer
   ============================================================ */
.sitefooter {
  border-top: 1px solid var(--hairline);
  background: var(--bg-alt);
  padding: 24px 0 34px;
  font-size: 12px; color: var(--text-3);
}
.sitefooter .inner { max-width: var(--doc-max); margin: 0 auto; padding: 0 22px; display: flex; justify-content: center; }
.sitefooter a { color: var(--text-2); }

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width: 700px) { .hero h1 br { display: none; } }
@media (max-width: 600px) {
  .hero { padding: 48px 16px 40px; }
  .toolbar, .entries-list { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body data-view="home">

<!-- Global Nav -->
<nav class="globalnav" aria-label="メインナビゲーション">
<div class="gn-inner">
<a class="gn-brand" href="index.html">Knowledge</a>
<div class="gn-links">
<a href="feed.xml" title="Atom フィードを購読">RSS</a>
<a href="https://github.com/branch10480/knowledge" target="_blank" rel="noopener">GitHub</a>
</div>
<button class="theme-toggle" id="themeToggle" aria-label="テーマ切り替え">
<span class="dot"></span> <span id="themeLabel">自動</span>
</button>
</div>
</nav>

<!-- Hero -->
<header class="hero">
<p class="eyebrow">Knowledge Base</p>
<h1>技術情報・学習ノート</h1>
<p class="abstract">iOS / Apple 開発、AI 業界動向、技術学習メモを蓄積していく知識ベースです。</p>
</header>

<!-- Toolbar: Search, Archive, Filter -->
<div class="toolbar">
<div class="search-row">
<input type="search" id="search-input" placeholder="タイトル・本文から検索..." aria-label="エントリを検索">
<span id="result-count"></span>
</div>
<div class="archive-row" id="archive-links">
<span class="archive-label">月別:</span>
</div>
<div class="filter-row">
<span class="filter-label">タグ:</span>
<div id="tag-filters"></div>
</div>
</div>

<!-- Entries -->
<main class="entries-list" id="entries-container" role="list">
__ENTRIES__
</main>

<footer class="sitefooter"><div class="inner">
<p>Powered by <a href="https://github.com/branch10480/knowledge">Knowledge</a> · Toshi Design System v0.7.0</p>
</div></footer>

<script>
(() => {
  const D = [__ENTRIES_JSON__];
  const S = document.getElementById('search-input');
  const RC = document.getElementById('result-count');
  const TC = document.getElementById('entries-container');
  const TF = document.getElementById('tag-filters');
  const AL = document.getElementById('archive-links');
  const root = document.documentElement;

  // Theme toggle — design-system と同一ロジック（3状態トグル）
  const btn = document.getElementById('themeToggle');
  const label = document.getElementById('themeLabel');
  const SEQ = ['auto', 'light', 'dark'];
  const NAMES = { auto: '自動', light: 'ライト', dark: 'ダーク' };
  let mode = localStorage.getItem('tds-theme') || 'auto';
  const browserTheme = () => window.matchMedia?.('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  const applyResolved = theme => {
    root.dataset.theme = theme === 'dark' ? 'dark' : 'light';
    root.dataset.themeMode = 'auto';
  };
  function resolveSystemTheme() {
    applyResolved(browserTheme());
  }
  function apply() {
    if (mode === 'auto') resolveSystemTheme();
    else { root.dataset.theme = mode; root.dataset.themeMode = mode; }
    label.textContent = NAMES[mode];
  }
  btn.addEventListener('click', () => {
    mode = SEQ[(SEQ.indexOf(mode) + 1) % SEQ.length];
    localStorage.setItem('tds-theme', mode);
    apply();
  });
  apply();

  // Collect all tags + archives
  const tags = new Map();
  const archives = {};
  D.forEach(e => {
    (e.tags||[]).forEach(t => tags.set(t, (tags.get(t)||0)+1));
    const ym = e.date.slice(0,7);
    if (!archives[ym]) archives[ym] = 0;
    archives[ym]++;
  });

  // Render archive links
  Object.keys(archives).sort().reverse().forEach(ym => {
    const a = document.createElement('a');
    a.className = 'archive-link';
    a.href = `archive/${ym}.html`;
    a.textContent = `${ym} (${archives[ym]})`;
    AL.appendChild(a);
  });

  // Render tag buttons
  [...tags.keys()].sort().forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.setAttribute('aria-pressed', 'false');
    btn.textContent = `${tag} (${tags[tag]})`;
    btn.addEventListener('click', () => {
      const pressed = btn.getAttribute('aria-pressed') === 'true';
      btn.setAttribute('aria-pressed', String(!pressed));
      F();
    });
    TF.appendChild(btn);
  });

  // Slug generation helper (same as Python's make_slug)
  function makeSlug(title, dateStr) {
    let slug = title.replace(/[^a-zA-Z0-9\u4e00-\u9fff\u3040-\u309f\u30a0-\u30ff\-_]/g, '');
    slug = slug.toLowerCase().slice(0, 80);
    return dateStr ? `${dateStr}-${slug}` : 'entry';
  }

  // Filter logic
  function F() {
    const q = S.value.toLowerCase().trim();
    const activeTags = [...TF.querySelectorAll('.filter-btn[aria-pressed="true"]')].map(b => b.textContent.match(/^(.+?)\\s*\\(\\d+\\)/)?.[1]||'').filter(Boolean);

    const filtered = D.filter(e => {
      if (q) {
        const haystack = `${e.title} ${e.content.replace(/<[^>]*>/g,'')} ${(e.tags||[]).join(' ')}`.toLowerCase();
        if (!haystack.includes(q)) return false;
      }
      if (activeTags.length > 0 && !activeTags.some(t => (e.tags||[]).includes(t))) return false;
      return true;
    });

    TC.innerHTML = filtered.map(e => `
      <article class="entry-card" role="listitem">
        <h2 class="entry-header"><a href="entry/${makeSlug(e.title, e.date)}.html">${e.title}</a></h2>
        <div class="entry-meta">
          <time datetime="${e.date}">${e.date}</time>
          ${e.source ? `<span class="entry-source"><a href="${escapeHtml(e.source)}" target="_blank" rel="noopener">${new URL(e.source).hostname.replace('www.','')}</a></span>` : ''}
        </div>
        <div class="entry-tags">${(e.tags||[]).map(t => `<span class="tag-pill">${t}</span>`).join('')}</div>
        <div class="entry-body">${e.content}</div>
      </article>
    `).join('');

    RC.textContent = `${filtered.length} / ${D.length} 件`;
  }

  function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  S.addEventListener('input', F);
  F();
})();
</script>
</body>
</html>
